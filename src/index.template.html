<!doctype html>
<html lang="fa" dir="rtl">
<head>

<body>

<!-- Loader: panels, the circle drawn, then the 13 drawn and filled -->
<div class="loader" aria-hidden="true">
  <div class="loader__panels"><i></i><i></i><i></i><i></i></div>
  <svg class="loader__mark" viewBox="0 0 1000 1000">
    <circle class="loader__circle" cx="500" cy="500" r="480" pathLength="1" />
    <path class="loader__glyph" pathLength="1" fill-rule="evenodd" d="{{GLYPH}}" />
  </svg>
</div>

<header class="top">
  <a class="top__logo" href="#top" aria-label="Cafe 13"><img src="assets/brand/logo.svg" alt="" width="36" height="36"></a>
  <div class="top__end">
    <a class="top__ig" data-ig href="https://www.instagram.com/caffe.13" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" class="dot"/></svg>
    </a>
    <a class="top__lang" data-lang-switch href="?lang=en">EN</a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero__disc" aria-hidden="true"><img src="assets/brand/logo.svg" alt=""></div>
    <div class="hero__inner">
      <p class="hero__kicker"><span class="hero__dot"></span><span data-t="hours"></span></p>
      <h1 class="hero__title"><span class="mask"><span data-t="name" class="hero__name"></span></span></h1>
      <p class="hero__lead" data-t="lead"></p>
      <p class="hero__notice" data-notice hidden></p>
      <nav class="hero__cats" aria-label="Menu"></nav>
    </div>
  </section>

  <div class="menuwrap">
    <div class="tabs" role="navigation">
      <div class="tabs__row"></div>
      <div class="tabs__chips"></div>
    </div>

    <div class="menu" id="menu"></div>
  </div>

  <section class="story" id="story" hidden>
    <div class="wrap">
      <p class="story__since"><span data-t="storySince"></span></p>
      <h2 class="story__title"><span class="mask"><span data-t="storyTitle"></span></span></h2>
      <p class="story__text" data-t="storyText"></p>
    </div>
  </section>

  <section class="visit" id="visit">

      <h2 class="visit__title"><span class="mask"><span data-t="visitTitle"></span></span></h2>
      <figure class="map" data-map>

      <div class="visit__grid">
        <div class="visit__cell"><p class="visit__label" data-t="addressLabel"></p><p class="visit__val" data-t="address"></p></div>

        <div class="visit__cell visit__cell--phone" hidden><p class="visit__label" data-t="phoneLabel"></p><p class="visit__val"><a data-phone href="#"></a></p></div>

      <a class="btn" data-ig href="https://www.instagram.com/caffe.13" target="_blank" rel="noopener">

</main>

<footer class="foot">

</footer>

<div class="sheet" hidden>

  <div class="sheet__panel" role="dialog" aria-modal="true">

  </div>
</div>
