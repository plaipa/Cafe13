<!doctype html>
<html lang="fa" dir="rtl" data-page="home" data-base="{{BASE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>کافه 13 تبریز | قهوه، برگر و صبحانه</title>
<meta name="description" content="کافه 13 در تبریز: قهوه و نوشیدنی، برگر و پیتزای دیترویتی، و صبحانه. آدرس، ساعت کاری و منو. Cafe 13 Tabriz.">
<meta name="theme-color" content="#111111">
<meta property="og:title" content="کافه 13 تبریز">
<meta property="og:description" content="قهوه، برگر و صبحانه در تبریز">
<meta property="og:image" content="https://caffe13.ir/assets/brand/logo-1024.png">
<meta property="og:url" content="https://caffe13.ir/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="کافه 13 تبریز">
<meta property="og:locale" content="fa_IR">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">{{JSONLD}}</script>
<link rel="canonical" href="https://caffe13.ir/">
<link rel="icon" href="{{BASE}}assets/brand/favicon.ico" sizes="any">
<link rel="icon" href="{{BASE}}assets/brand/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{BASE}}assets/brand/apple-touch-icon.png">
<link rel="manifest" href="{{BASE}}manifest.webmanifest">
<link rel="preload" href="{{BASE}}assets/fonts/Vazirmatn-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{BASE}}assets/vendor/lenis.css">
<link rel="stylesheet" href="{{BASE}}css/site.css">
<script>(function(d){d.classList.add('js');if(!matchMedia('(prefers-reduced-motion: reduce)').matches){d.classList.add('is-loading');setTimeout(function(){d.classList.remove('is-loading')},9000)}})(document.documentElement)</script>
</head>
<body>

<!-- Loader: panels, the circle drawn, then the 13 drawn and filled -->
<div class="loader" aria-hidden="true">
  <div class="loader__panels"><i></i><i></i><i></i><i></i></div>
  <svg class="loader__mark" viewBox="0 0 1000 1000">
    <circle class="loader__circle" cx="500" cy="500" r="480" pathLength="1" />
    <path class="loader__glyph" pathLength="1" fill-rule="evenodd" d="{{GLYPH}}" />
  </svg>
</div>

<header class="top">
  <a class="top__logo" href="{{BASE}}" aria-label="Cafe 13"><img src="{{BASE}}assets/brand/logo.svg" alt="" width="36" height="36"></a>
  <div class="top__end">
    <a class="top__nav" data-t="nav" href="{{BASE}}menu/"></a>
    <a class="top__ig" data-ig href="https://www.instagram.com/caffe.13" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" class="dot"/></svg>
    </a>
    <a class="top__lang" data-lang-switch href="?lang=en">EN</a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero__film" data-film aria-hidden="true">
      <div class="hero__reel"><video class="hero__video" muted loop playsinline preload="none" disablepictureinpicture disableremoteplayback tabindex="-1"></video></div>
    </div>
    <div class="hero__inner">
      <p class="hero__kicker"><span class="hero__dot"></span><span data-t="hours"></span></p>
      <h1 class="hero__title"><span class="mask"><span data-t="name" class="hero__name"></span></span></h1>
      <p class="hero__lead" data-t="lead"></p>
      <p class="hero__notice" data-notice hidden></p>
      <nav class="hero__cats" aria-label="Menu"></nav>
    </div>
  </section>

  <section class="story" id="story" hidden>
    <div class="wrap story__wrap">
      <p class="story__since"><span data-t="storySince"></span></p>
      <div class="story__year" data-odo aria-hidden="true"></div>
      <div class="story__line" aria-hidden="true"><span class="story__rule"></span><span class="story__now" data-t="storyNow"></span></div>
      <h2 class="story__title"><span class="mask"><span data-t="storyTitle"></span></span></h2>
      <div class="story__body" data-story-body></div>
      <div class="story__stats">
        <div class="stat"><p class="stat__num" data-stat-years></p><p class="stat__lbl" data-t="statYears"></p></div>      </div>
      <a class="btn btn--dark story__cta" href="{{BASE}}menu/">
        <span class="btn__fill"></span>
        <span class="btn__txt"><span class="btn__a"><b data-t="storyCta"></b></span><span class="btn__b" aria-hidden="true"><b data-t="storyCta"></b></span></span>
      </a>
    </div>
  </section>

  <section class="visit" id="visit">
    <div class="wrap">
      <h2 class="visit__title"><span class="mask"><span data-t="visitTitle"></span></span></h2>
{{MAP}}
      <div class="visit__grid">
        <div class="visit__cell"><p class="visit__label" data-t="addressLabel"></p><p class="visit__val" data-t="address"></p></div>
        <div class="visit__cell"><p class="visit__label" data-t="hoursLabel"></p><p class="visit__val" data-t="hours"></p></div>
        <div class="visit__cell visit__cell--phone" hidden><p class="visit__label" data-t="phoneLabel"></p><p class="visit__val"><a data-phone href="#"></a></p></div>
      </div>
      <a class="btn" data-ig href="https://www.instagram.com/caffe.13" target="_blank" rel="noopener">
        <span class="btn__fill"></span>
        <span class="btn__txt"><span class="btn__a"><b data-t="igCta"></b> <span class="ltr">@caffe.13</span></span><span class="btn__b" aria-hidden="true"><b data-t="igCta"></b> <span class="ltr">@caffe.13</span></span></span>
      </a>
    </div>
  </section>
</main>

<footer class="foot">
  <svg class="foot__mark" viewBox="0 0 1000 1000" aria-hidden="true"><path pathLength="1" fill-rule="evenodd" d="{{GLYPH}}"/></svg>
  <div class="foot__row">
    <p><span data-t="name"></span> · <span class="ltr" data-year></span></p>
    <p><a class="foot__link" data-t="navMenu" href="{{BASE}}menu/"></a></p>
  </div>
  <p class="foot__credit">Handcrafted with JavaScript, CSS &amp; a lot of coffee by <a href="https://wa.me/989140914214" target="_blank" rel="noopener">Sattari</a></p>
</footer>

<a class="call" data-call href="#" hidden>
  <span class="call__ring" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8Z"/></svg></span>
  <span class="call__txt" data-t="callCta"></span><span class="call__num ltr" data-call-num></span>
</a>

<script src="{{BASE}}assets/vendor/gsap.min.js"></script>
<script src="{{BASE}}assets/vendor/ScrollTrigger.min.js"></script>
<script src="{{BASE}}assets/vendor/SplitText.min.js"></script>
<script src="{{BASE}}assets/vendor/CustomEase.min.js"></script>
<script src="{{BASE}}assets/vendor/lenis.min.js"></script>
<script src="{{BASE}}js/site.js"></script>
</body>
</html>
