<title>صفحه پیدا نشد | کافه 13</title>

<link rel="icon" href="/assets/brand/logo.svg" type="image/svg+xml">

<style>
  .nf { min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 32px var(--pad); text-align: center; }
  .nf img { width: 56px; height: 56px; }
  .nf .nf__code { margin: 8px 0 0; font: 400 clamp(110px, 38vw, 220px)/.8 var(--serif); color: var(--yellow); letter-spacing: -.03em; direction: ltr; }
  .nf h1 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.4; }
  .nf p { margin: 0; color: var(--g200); font-size: 17px; line-height: 1.7; }
  .nf p.en { font: italic 400 20px/1.4 var(--serif); color: var(--g400); direction: ltr; }
  .nf__go { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .nf__go a { min-height: 48px; padding: 0 28px; display: inline-flex; align-items: center; border-radius: 24px; font-weight: 800; font-size: 16px; background: var(--yellow); color: var(--black); transition: background-color .3s, color .3s; }
  .nf__go a + a { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1px var(--g700); }
  @media (hover: hover) { .nf__go a:hover { background: var(--red); color: var(--paper); box-shadow: none; } }
</style>
</head>
<body>
<main class="nf">
  <a href="/" aria-label="Cafe 13"><img src="/assets/brand/logo.svg" alt="" width="56" height="56"></a>
  <p class="nf__code" aria-hidden="true">404</p>
  <h1>این صفحه پیدا نشد</h1>
  <p class="en">This page does not exist.</p>
  <div class="nf__go"><a href="/">صفحه اصلی</a><a href="/menu/">منو</a></div>
</main>
</body>
</html>
