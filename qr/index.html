<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>کارت QR میز | کافه 13</title>
<link rel="icon" href="../assets/brand/logo.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "Vazirmatn"; src: url("../assets/fonts/Vazirmatn-var.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Instrument Serif"; src: url("../assets/fonts/InstrumentSerif-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  :root { --red: #EA3625; --yellow: #F5CD6E; --black: #111; --g400: #A3A3A3; --paper: #F7F7F5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Vazirmatn", system-ui, sans-serif; background: #E9E9E6; color: var(--paper);
    min-height: 100vh; display: grid; place-items: center; gap: 22px; padding: 28px 16px 40px;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; color: #333; font-size: 14px; }
  .tools button, .tools a {
    height: 44px; padding: 0 22px; border-radius: 22px; border: 0; font: 700 15px "Vazirmatn", sans-serif;
    background: var(--black); color: var(--yellow); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
  }
  .tools a { background: transparent; color: #333; border: 1px solid #aaa; }

  /* The card: A6 portrait (105 x 148 mm) */
  .card {
    width: 105mm; height: 148mm; background: var(--black); border-radius: 6mm; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 9mm 8mm 8mm; text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,.25);
  }
  .card::before { content: ""; position: absolute; width: 82mm; height: 82mm; border-radius: 50%; background: var(--red); inset-inline-end: -40mm; top: -44mm; }
  .card > * { position: relative; }
  .logo { width: 17mm; height: 17mm; }
  .title { margin: 0; font-size: 11.5mm; font-weight: 900; line-height: 1.15; color: var(--paper); }
  .sub { margin: 1.5mm 0 0; font: 400 6.4mm/1 "Instrument Serif", Georgia, serif; font-style: normal; color: var(--yellow); letter-spacing: .01em; }
  .qr { width: 56mm; height: 56mm; background: #fff; border-radius: 4mm; padding: 1.5mm; }
  .qr img { display: block; width: 100%; height: 100%; }
  .foot { margin: 0; font-size: 3.4mm; color: var(--g400); display: flex; gap: 2.5mm; align-items: center; justify-content: center; }
  .foot b { color: var(--yellow); font-weight: 700; direction: ltr; unicode-bidi: isolate; }
  .dot { width: 1.2mm; height: 1.2mm; border-radius: 50%; background: var(--red); }

  @page { size: 105mm 148mm; margin: 0; }
  @media print {
    body { background: none; padding: 0; display: block; min-height: 0; }
    .tools { display: none; }
    .card { border-radius: 0; box-shadow: none; page-break-after: avoid; }
  }
</style>
</head>
<body>

<div class="tools">
  <button type="button" onclick="window.print()">چاپ کارت</button>
  <a href="menu-qr.svg" download="cafe13-menu-qr.svg">دانلود QR (SVG)</a>
  <a href="menu-qr.png" download="cafe13-menu-qr.png">دانلود QR (PNG)</a>
</div>

<article class="card">
  <img class="logo" src="../assets/brand/logo.svg" alt="">
  <div>
    <h1 class="title">منو را اسکن کنید</h1>
    <p class="sub">Scan for the menu</p>
  </div>
  <div class="qr"><img src="menu-qr.svg" alt="QR code for the Cafe 13 menu"></div>
  <p class="foot"><b>caffe13.ir/menu</b><span class="dot"></span><b>@caffe.13</b></p>
</article>

</body>
</html>
